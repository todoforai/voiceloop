<!doctype html>
<!-- voiceloop minimal example: mic → agent → speaker. No bundler, no framework.
     Serve the package root and open /examples/simple-browser.html:
       from a clone:  npx serve .
       from npm:      npx serve node_modules/@todoforai/voiceloop
     file:// won't work — mic + module imports need http://localhost or https. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>voiceloop — minimal example</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
    #talk { font-size: 1.1rem; padding: .6rem 1.6rem; border-radius: 2rem; border: 1px solid #888; cursor: pointer; }
    #talk.on { background: #e33; color: #fff; border-color: #e33; }
    #state { color: #888; margin-left: .8rem; }
    .msg { margin: .8rem 0; }
    .user { color: #06c; }
    .agent .unspoken { color: #aaa; }
  </style>
</head>
<body>
  <h1>voiceloop</h1>
  <p>
    <button id="talk">Start talking</button>
    <span id="state">idle</span>
  </p>
  <div id="log"></div>

  <script type="module">
    import { VoiceAgent, unlockAudio, prewarmVoice } from '../src/index.js';

    prewarmVoice();   // preload VAD/WASM while the page sits idle

    const $ = (id) => document.getElementById(id);
    const log = $('log');
    let userEl = null, agentEl = null;

    const bubble = (cls) => {
      const el = document.createElement('div');
      el.className = `msg ${cls}`;
      log.appendChild(el);
      return el;
    };

    const agent = new VoiceAgent({
      // Point at any OpenAI-compatible /chat/completions endpoint.
      // Quick local test with Ollama (from the repo root):
      //   ollama pull qwen3
      //   OLLAMA_ORIGINS='*' ollama serve
      //   npx serve .          → open http://localhost:3000/examples/simple-browser.html
      // (OLLAMA_ORIGINS allows this page's origin; mic access needs http://localhost or https.)
      llmUrl: 'http://localhost:11434/v1/chat/completions',
      model: 'qwen3',

      persona: 'You are a concise, friendly voice assistant.',

      onEvent: (e) => {
        if (e.type === 'state') {
          $('state').textContent = e.state;
        } else if (e.type === 'stt') {
          userEl ??= bubble('user');
          // A turn can die WITHOUT turnComplete (echo-dropped, retracted, reply error) — userEl
          // then survives at its old position and ??= would paint the NEXT turn's speech above
          // later messages. append() moves an existing node back to the bottom (no-op otherwise).
          log.append(userEl);
          // partial: committed prefix + live tail; turnComplete: e.text is the whole turn
          userEl.textContent = e.turnComplete ? e.text : `${e.committed ?? ''} ${e.text}`.trim();
          if (e.turnComplete) userEl = null;
        } else if (e.type === 'assistant') {
          const full = e.full ?? e.text;
          if (!full) { agentEl?.remove(); agentEl = null; return; }   // aborted before any audio → drop the draft
          agentEl ??= bubble('agent');
          agentEl.innerHTML = '';
          agentEl.append(e.text);                       // spoken so far
          if (full.length > e.text.length) {            // not yet spoken → dimmed
            const rest = document.createElement('span');
            rest.className = 'unspoken';
            rest.textContent = full.slice(e.text.length);
            agentEl.appendChild(rest);
          }
          if (e.final) agentEl = null;
        } else if (e.type === 'error') {
          bubble('user').textContent = `⚠ ${e.error}`;
        }
      },
    });

    const setBtn = (on) => {
      $('talk').textContent = on ? 'Stop' : 'Start talking';
      $('talk').classList.toggle('on', on);
    };
    $('talk').onclick = async () => {
      if (agent.state === 'idle') {
        unlockAudio();                                  // must happen inside the click gesture
        setBtn(true);
        try { await agent.start(); } catch { /* error surfaced via onEvent */ }
        if (agent.state === 'idle') setBtn(false);      // start failed (mic denied, …)
      } else {
        agent.stop();
        setBtn(false);
      }
    };
  </script>
</body>
</html>
