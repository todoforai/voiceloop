<!doctype html>
<!-- voiceloop demo: the whole loop behind one button, plus the numbers that say
     whether it feels seamless. No bundler, no framework, no dependencies.

       from a clone:  npx serve .     → /examples/demo.html
       from npm:      npx serve node_modules/@todoforai/voiceloop

     file:// won't work — mic + module imports need http://localhost or https.
     Out of the box it runs in ECHO mode: Web Speech STT + local Piper TTS +
     a fake "LLM" that repeats you. No keys, no backend, no cost. Open
     settings to point it at a real LLM. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>voiceloop</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0b0d10; --panel:#14171c; --line:#242932; --fg:#eceef1; --dim:#79818d;
    --c:#4a5361;                        /* current state colour — everything reads from here */
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.55 ui-sans-serif,system-ui,-apple-system,sans-serif }
  main { max-width:660px; margin:0 auto; padding:36px 18px 48px;
         display:flex; flex-direction:column; align-items:center; gap:16px }

  /* ── the orb: four radial blobs drifting behind a glass shell ──────────────
     Plain CSS on purpose. A WebGPU version looks marginally better and is dark
     for every Linux visitor (Chrome blocklists the adapter there), and an SVG
     goo filter costs real CPU per frame for the same silhouette. This is ~25
     lines, runs on the compositor, and degrades to a flat disc under
     prefers-reduced-motion. */
  #mic { position:relative; width:210px; height:210px; border-radius:50%; border:0; padding:0;
         cursor:pointer; overflow:hidden; background:#0c0f14; display:grid; place-items:center;
         --a:#2b3d5c; --b:#39506e; --cc:#2a3550; --d:#334463; --spin:30s; --glow:.14;
         transition:transform .18s ease-out }
  /* Each blob is a soft disc smaller than the orb, wandering on its own ellipse.
     Blurred and screen-blended, four of them read as one body that swells and
     pinches where they overlap — metaballs, minus the shader. */
  #mic i { position:absolute; width:52%; height:52%; left:24%; top:24%; border-radius:50%;
           filter:blur(13px); mix-blend-mode:screen; animation:wander var(--spin) ease-in-out infinite;
           transition:background 1s }   /* colours cross-fade; the speed change snaps (animation-* isn't animatable) */
  #mic i:nth-child(1) { background:radial-gradient(circle, var(--a)  0 26%, transparent 66%) }
  #mic i:nth-child(2) { background:radial-gradient(circle, var(--b)  0 24%, transparent 64%);
                        animation-duration:calc(var(--spin)*.72); animation-direction:reverse }
  #mic i:nth-child(3) { background:radial-gradient(circle, var(--cc) 0 28%, transparent 68%);
                        animation-duration:calc(var(--spin)*1.4); animation-delay:calc(var(--spin)*-.3) }
  #mic i:nth-child(4) { background:radial-gradient(circle, var(--d)  0 22%, transparent 62%);
                        animation-duration:calc(var(--spin)*.9); animation-direction:reverse;
                        animation-delay:calc(var(--spin)*-.55) }
  /* glass shell: specular cap + rim shadow, one pseudo each */
  #mic::before { content:''; position:absolute; inset:0; border-radius:50%; pointer-events:none;
                 background:radial-gradient(120% 90% at 32% 20%, rgba(255,255,255,.30) 0 10%,
                                            rgba(255,255,255,.05) 26%, transparent 52%);
                 box-shadow:inset 0 0 46px rgba(0,0,0,.75), inset 0 1px 1px rgba(255,255,255,.24) }
  #mic::after  { content:''; position:absolute; inset:0; border-radius:50%; pointer-events:none;
                 box-shadow:0 0 44px 8px var(--b); opacity:var(--glow); transition:opacity .8s }
  @keyframes wander {
    0%,100% { transform:translate(-34%,-22%) scale(1)    }
    25%     { transform:translate( 30%,-34%) scale(1.18) }
    50%     { transform:translate( 36%, 28%) scale(.86)  }
    75%     { transform:translate(-28%, 34%) scale(1.12) }
  }
  /* the glyph leads while the orb is dark; once the loop is live the orb says it better */
  #glyph { position:relative; font-size:36px; line-height:1; transition:opacity .4s;
           text-shadow:0 2px 12px #000 }
  body:not([data-state="idle"]) #glyph { opacity:0 }

  /* same object, more energy — the whole state display is these four lines */
  body[data-state="listening"] #mic { --a:#12b87e; --b:#39d98a; --cc:#0e7fb4; --d:#5fd9b4; --spin:14s;  --glow:.45 }
  body[data-state="thinking"]  #mic { --a:#e0a12e; --b:#ff9f43; --cc:#a63fc0; --d:#ffd166; --spin:6s;   --glow:.65 }
  body[data-state="speaking"]  #mic { --a:#ff7a2d; --b:#ff5f6d; --cc:#ffa94d; --d:#b83fd0; --spin:4s;   --glow:.9 }
  /* VAD: the orb swells the instant the mic hears you — the "it's alive" tell */
  body[data-vad="1"] #mic { transform:scale(1.035) }

  body[data-state="listening"] { --c:#39d98a }
  body[data-state="thinking"]  { --c:#ffc453 }
  body[data-state="speaking"]  { --c:#ff8a3d }

  @media (prefers-reduced-motion: reduce) {
    #mic i { animation:none } #mic { transition:none }
  }

  #status { color:var(--c); font-size:14px; min-height:22px; text-align:center; transition:color .3s }
  #lat { font:12px/1 ui-monospace,monospace; color:var(--dim); min-height:14px }

  /* ── transcript ─────────────────────────────────────────────────────── */
  #chat { width:100%; display:flex; flex-direction:column; gap:10px }
  #chat:not(:empty) { margin-top:6px }
  .msg { padding:10px 14px; border-radius:14px; max-width:82%; white-space:pre-wrap; word-break:break-word }
  .msg.user { align-self:flex-end;   background:#212c3a; border-bottom-right-radius:4px }
  .msg.ai   { align-self:flex-start; background:#1a1e25; border-bottom-left-radius:4px }
  .msg.interim { opacity:.5 }
  .msg .tail { opacity:.35 }                 /* generated, not yet spoken */
  .msg.tool { align-self:flex-start; background:#161d17; color:#8fc79a;
              font:12px/1.4 ui-monospace,monospace }
  .msg.note { align-self:center; background:none; color:var(--dim); font-size:12px; padding:0 }
  .msg.err  { align-self:center; background:#38141d; color:#ffb0bd; font-size:13px }

  /* ── everything else, out of the way ────────────────────────────────── */
  .bar { width:100%; display:flex; gap:8px }
  input, select, button.btn { background:#0f1216; color:var(--fg); border:1px solid var(--line);
                              border-radius:9px; padding:9px 12px; font:inherit }
  input:focus, select:focus { outline:none; border-color:var(--c) }
  button.btn { cursor:pointer } button.btn:hover { border-color:#3a424e }
  #typed { flex:1 }
  details { width:100%; border-top:1px solid var(--line); padding-top:10px }
  summary { cursor:pointer; color:var(--dim); font-size:13px; list-style:none }
  summary::before { content:'▸ ' } details[open] summary::before { content:'▾ ' }
  .grid { display:flex; flex-wrap:wrap; gap:10px; padding:12px 0 4px }
  label { font-size:11px; color:var(--dim); display:flex; flex-direction:column; gap:4px }
  #log { font:11px/1.5 ui-monospace,monospace; color:var(--dim);
         max-height:220px; overflow:auto; white-space:pre-wrap; padding-top:8px }
</style>
</head>
<body>
<main>
  <button id="mic" title="click to start / stop · click while it talks to interrupt">
    <i></i><i></i><i></i><i></i><span id="glyph">🎙</span>
  </button>
  <div id="status">click to start · then just talk</div>
  <div id="lat"></div>

  <div id="chat"></div>

  <div class="bar">
    <input id="typed" placeholder="…or type a turn">
    <button class="btn" id="send">Send</button>
  </div>

  <details>
    <summary>settings</summary>
    <div class="grid">
      <label>mode<select id="mode">
        <option value="echo">echo — no keys, no backend</option>
        <option value="llm">full loop — your LLM</option>
      </select></label>
      <label>LLM url<input id="llmUrl" size="30" value="http://localhost:11434/v1/chat/completions"></label>
      <label>model<input id="model" size="14" value="llama3.2"></label>
      <label>STT<select id="sttProvider"></select></label>
      <label>STT token url<input id="sttTokenUrl" size="30" placeholder="your backend route (cloud STT only)"></label>
      <label>api key<input id="apiKey" size="18" placeholder="Bearer for LLM · X-API-Key for token url"></label>
      <label>lang<select id="sttLang"></select></label>
      <label>voice<select id="voice"></select></label>
      <label>mic<select id="micDeviceId"><option value="">default</option></select></label>
    </div>
    <div class="bar">
      <button class="btn" id="clear">Clear</button>
      <button class="btn" id="muteMic">Mute mic</button>
      <button class="btn" id="muteTts">Mute voice</button>
    </div>
  </details>

  <details><summary>log</summary><div id="log"></div></details>
</main>

<script type="module">
import { VoiceAgent, PiperTTS, unlockAudio, prewarmVoice, STT_PROVIDERS, LANG_NAMES } from '../src/index.js';

prewarmVoice();   // load VAD/WASM + build the Silero session while the page sits idle

const $ = id => document.getElementById(id);
const fill = (id, entries) => $(id).append(...entries.map(([value, textContent]) =>
  Object.assign(document.createElement('option'), { value, textContent })));

// Every choice below is READ from the library, never retyped here: a provider added to STT_PROVIDERS
// or a language added to LANG_NAMES shows up in this page by itself. A hand-typed copy would be a
// second source of truth that silently rots — and a demo that lies about what the library supports.
fill('sttProvider', Object.keys(STT_PROVIDERS).map(p => [p, p === 'webspeech' ? 'webspeech — free, in-browser' : p]));
fill('sttLang', Object.entries(LANG_NAMES).map(([code, name]) => [code, `${code} — ${name}`]));
const SETTINGS = ['mode','llmUrl','model','sttProvider','sttTokenUrl','apiKey','sttLang','voice','micDeviceId'];
for (const id of SETTINGS) {
  const v = localStorage.getItem('vl.' + id); if (v) $(id).value = v;
  $(id).addEventListener('change', () => localStorage.setItem('vl.' + id, $(id).value));
}
const log = (...a) => {
  const line = `${new Date().toISOString().slice(11,23)} ${a.map(x => typeof x === 'string' ? x : JSON.stringify(x)).join(' ')}`;
  $('log').textContent = (line + '\n' + $('log').textContent).slice(0, 20000);
};

// ── transcript ──────────────────────────────────────────────────────────────
const chat = $('chat');
let interimEl = null, aiEl = null;
const toolEls = new Map();
const bubble = (cls, text = '') => {
  const el = document.createElement('div');
  el.className = `msg ${cls}`; el.textContent = text;
  chat.append(el); el.scrollIntoView({ block:'nearest' });
  return el;
};

// ── latency: the two numbers that decide whether this feels alive ───────────
let t0 = 0, tText = 0, tAudio = 0;
const showLat = () => $('lat').textContent = [
  tText  && `first token ${tText - t0}ms`,
  tAudio && `first sound ${tAudio - t0}ms`,
].filter(Boolean).join('   ·   ');

// undefined (not '') when unset — so PiperTTS applies its OWN default voice instead of this page
// re-declaring one. The picker is populated async below and adopts whatever it resolved to.
const tts = new PiperTTS(localStorage.getItem('vl.voice') || undefined);
let agent = null;

// Echo mode: a stand-in "LLM" that repeats the turn — exercises the entire
// VAD→STT→…→TTS loop, barge-in included, with no key and no backend.
async function* echoLLM(history) {
  const last = [...history].reverse().find(m => m.role === 'user')?.content ?? '';
  for (const w of `You said: ${last}`.match(/\S+\s*/g) ?? []) {
    yield { text: w }; await new Promise(r => setTimeout(r, 25));
  }
}

// A typed turn drives the same state machine without a mic — don't claim we're listening then.
let micOn = false;
const STATUS = {
  idle:      () => micOn ? 'listening — just talk' : 'click to start · then just talk',
  listening: () => micOn ? 'listening — just talk' : 'ready · click to talk',
  thinking:  () => 'thinking…',
  speaking:  () => micOn ? 'speaking — talk over it to interrupt' : 'speaking — click to interrupt',
};
const setState = s => {
  document.body.dataset.state = micOn || s !== 'listening' ? s : 'idle';
  $('status').textContent = STATUS[s]?.() ?? s;
};

function onEvent(e) {
  if (e.type !== 'stt' || e.turnComplete) log(e);
  switch (e.type) {
    case 'state':
      // The agent can stop itself (mic denied, STT socket died) — the mic light
      // follows the agent, never the other way round.
      if (e.state === 'idle' && agent?.closed) { micOn = false; document.body.dataset.vad = '0'; }
      setState(e.state);
      break;
    case 'vad': document.body.dataset.vad = e.active ? '1' : '0'; break;
    case 'stt':
      if (e.turnComplete) {
        interimEl?.remove(); interimEl = null;
        bubble('user', e.text);
        aiEl = null; t0 = Date.now(); tText = tAudio = 0; $('lat').textContent = '';
      } else {
        interimEl ??= bubble('user interim');
        interimEl.textContent = `${e.committed ?? ''} ${e.text}`.trim();
        interimEl.scrollIntoView({ block:'nearest' });
      }
      break;
    case 'assistant': {
      // Empty and non-final means "that draft never happened" (interrupted before
      // a word was spoken) — drop the bubble rather than blank it.
      if (!e.text && !e.final) { aiEl?.remove(); aiEl = null; break; }
      if (!tText && t0) { tText = Date.now(); showLat(); }
      // `full` only exists once the TTS progress cursor is live — i.e. a clip is
      // actually playing. The 'speaking' state is just the first token, not sound.
      if (e.full != null && t0 && !tAudio) { tAudio = Date.now(); showLat(); }
      aiEl ??= bubble('ai');
      aiEl.textContent = e.text;                                    // spoken so far
      const tail = (e.full ?? e.text).slice(e.text.length);         // generated, not yet heard
      if (tail) aiEl.append(Object.assign(document.createElement('span'), { className:'tail', textContent:tail }));
      aiEl.scrollIntoView({ block:'nearest' });
      break;
    }
    case 'tool': {
      // running and result arrive as two events with one id: update, don't stack.
      const el = toolEls.get(e.id) ?? bubble('tool');
      if (e.id) toolEls.set(e.id, el);
      el.textContent = `🔧 ${e.name}(${JSON.stringify(e.args)})${e.running ? ' …' : ` → ${JSON.stringify(e.result ?? '')}`.slice(0,200)}`;
      break;
    }
    case 'echo':  bubble('note', `self-echo dropped: ${e.text}`); break;
    case 'error': bubble('err', e.error); break;
  }
}

const muted = id => $(id).dataset.on === '1';
const makeAgent = () => {
  const a = new VoiceAgent({
    llmUrl: $('llmUrl').value.trim(),
    model: $('model').value.trim(),
    apiKey: $('apiKey').value.trim(),
    sttProvider: $('sttProvider').value,
    sttTokenUrl: $('sttTokenUrl').value.trim(),
    sttLang: $('sttLang').value,
    micDeviceId: $('micDeviceId').value,
    persona: 'You are a concise, friendly voice assistant. Keep answers to a sentence or two.',
    tts,
    llm: $('mode').value === 'echo' ? echoLLM : undefined,
    onEvent,
  });
  a.setMuted(muted('muteMic')); a.setTtsMuted(muted('muteTts'));   // the toggles survive a rebuild
  log('agent created; stt =', a.sttProvider);
  return a;
};

// ── one button does everything ──────────────────────────────────────────────
const stop = () => {
  agent?.destroy(); agent = null; micOn = false;
  document.body.dataset.vad = '0'; setState('idle');
};
$('mic').onclick = async () => {
  unlockAudio();                                   // must be inside the gesture (autoplay policy)
  // A reply in flight? then the click means "shut up", whether the mic is open
  // or not — it cancels the turn and keeps the session.
  if (agent && (agent.state === 'thinking' || agent.state === 'speaking')) return agent.interrupt();
  if (micOn) return stop();
  agent ??= makeAgent();
  micOn = true; setState('listening');
  try { await agent.start(); }
  catch (e) { bubble('err', String(e?.message ?? e)); stop(); }
};

$('send').onclick = () => {
  const text = $('typed').value.trim(); if (!text) return;
  unlockAudio();
  agent ??= makeAgent();
  agent.sendUserText(text);       // emits its own user bubble via the stt turnComplete event
  $('typed').value = '';
};
$('typed').onkeydown = e => { if (e.key === 'Enter') $('send').click(); };

$('clear').onclick = () => { chat.textContent = ''; $('log').textContent = ''; $('lat').textContent = '';
                             interimEl = aiEl = null; toolEls.clear(); };
const toggle = (id, fn) => $(id).onclick = () => {
  const on = $(id).dataset.on !== '1';
  $(id).dataset.on = on ? '1' : '0';
  $(id).style.borderColor = on ? 'var(--c)' : '';
  fn(on);
};
toggle('muteMic', on => agent?.setMuted(on));
toggle('muteTts', on => agent?.setTtsMuted(on));

// Voice switches live. The rest are constructor options, so they can only apply
// to a NEW agent — drop the current one so the next turn builds it from these.
$('voice').addEventListener('change', () => { tts.setVoice($('voice').value); log('voice →', $('voice').value); });
for (const id of SETTINGS.filter(i => i !== 'voice'))
  $(id).addEventListener('change', () => {
    if (micOn) return bubble('note', `stop the mic to apply ${id}`);
    if (agent) { agent.destroy(); agent = null; log(id, '→ agent rebuilt on next turn'); }
  });

// ── device + voice lists ────────────────────────────────────────────────────
tts.voices().then(vs => {
  fill('voice', vs.map(v => [v.id, v.id]));
  $('voice').value = localStorage.getItem('vl.voice') || tts.voiceId;   // the library's own default, not a copy of it
  tts.setVoice($('voice').value);
}).catch(e => log('voice list failed', String(e)));
navigator.mediaDevices?.enumerateDevices().then(ds => {
  for (const d of ds.filter(d => d.kind === 'audioinput'))
    $('micDeviceId').append(Object.assign(document.createElement('option'),
      { value: d.deviceId, textContent: d.label || d.deviceId.slice(0,8) }));
}).catch(() => {});

setState('idle');
window.agent = () => agent;   // console poking: agent().history, …
</script>
</body>
</html>
