<!doctype html>
<!-- bench/blackbox/agent.html — voiceloop AS A SYSTEM UNDER TEST for the black-box rig.
     Plain voiceloop wired to the bench mock LLM (fixed responses); mic/speaker come from whatever
     the browser is given — launch Chrome with PULSE_SOURCE=bench_mic PULSE_SINK=bench_spk and
     fake-ui-for-media-stream so no permission prompt blocks the run.
     Query params: ?stt=deepgram|elevenlabs|webspeech (default deepgram) &token=<provider api key> -->
<html lang="en">
<head><meta charset="utf-8"><title>voiceloop — bench SUT</title>
<style>body{font:14px/1.5 monospace;margin:1rem} #log div{white-space:pre-wrap}</style></head>
<body>
<div id="state">booting…</div><div id="log"></div>
<script type="module">
  import { VoiceAgent, unlockAudio, prewarmVoice } from '../../src/index.js';

  const q = new URLSearchParams(location.search);
  const sttProvider = q.get('stt') || 'deepgram';
  const log = (s) => { const d = document.createElement('div'); d.textContent = s; document.getElementById('log').prepend(d); };

  // ── INSTRUMENTATION: internal milestones on the EPOCH clock (mergeable with the driver's
  // timeline — same machine, same clock). Pulled after the run via window.__bench.
  const nw = (s) => { let n = 0; for (const c of s || '') if (!/\s/.test(c)) n++; return n; };
  window.__bench = [];
  const rec = (type, extra = {}) => window.__bench.push({ epoch: Date.now(), type, ...extra });
  // RIG FIX: the virtual mic has NO acoustic coupling to the virtual speaker (headset-equivalent),
  // but Chrome's AEC — with the TTS as far-end reference and zero echo to find — suppresses the
  // person's speech during playback (double-talk suppression), eating whole interruptions.
  // Force echoCancellation off unless ?aec=on (to test the speakers-with-echo scenario instead).
  if (q.get('aec') !== 'on') {
    const gum = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
    navigator.mediaDevices.getUserMedia = (c) =>
      gum(c?.audio ? { ...c, audio: { ...(c.audio === true ? {} : c.audio), echoCancellation: false, noiseSuppression: false } } : c);
  }

  // First streamed byte of each LLM response = llm_first_token (covers speculative prefetches too).
  const origFetch = window.fetch.bind(window);
  window.fetch = async (...a) => {
    const r = await origFetch(...a);
    if (!String(a[0]).includes('/v1/chat/completions') || !r.body) return r;
    let first = false;
    const ts = new TransformStream({ transform(c, ctrl) { if (!first) { first = true; rec('llm_first_token'); } ctrl.enqueue(c); } });
    return new Response(r.body.pipeThrough(ts), r);
  };

  prewarmVoice();

  const agent = new VoiceAgent({
    llmUrl: `${location.origin}/v1/chat/completions`,   // the bench server's FIXED mock LLM
    model: 'bench',
    persona: 'irrelevant — the mock LLM ignores the prompt',
    sttProvider,
    sttTokenUrl: `${location.origin}/bench/stt-token`,   // bench server mints (provider grant endpoints reject browser CORS)
    onEvent: (e) => {
      if (e.type === 'state') {
        document.getElementById('state').textContent = e.state;
        if (e.state === 'thinking') rec('turn_committed');
      }
      if (e.type === 'stt') {
        if (e.turnComplete) { rec('stt_final', { text: e.text }); log(`stt: ${e.text}`); }
        else if (e.text) rec('stt_partial', { text: e.text });
      }
      if (e.type === 'echo') rec('echo_drop', { text: e.text });
      if (e.type === 'vad') rec('vad', { on: e.speaking ?? e.on });
      if (e.type === 'diag') rec('diag', { msg: e.msg ?? JSON.stringify(e) });
      if (e.type === 'assistant' && e.final) {
        rec('reply_done', { heardNw: nw(e.text), totalNw: nw(e.full ?? e.text) });
        log(`said: ${e.text}`);
      }
      if (e.type === 'error') log(`ERR: ${e.error}`);
    },
  });

  // fake-ui-for-media-stream auto-grants mic; autoplay-policy=no-user-gesture-required lets audio out.
  await unlockAudio();
  await agent.start();
  log('agent running');
</script>
</body></html>
