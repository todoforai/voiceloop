<!doctype html>
<!-- voiceloop demo: the whole loop behind one button, plus the numbers that say
     whether it feels seamless. No bundler, no framework, no dependencies.

       from a clone:  npx serve .     → http://localhost:3000/
       from npm:      npx serve node_modules/@todoforai/voiceloop

     file:// won't work — mic + module imports need http://localhost or https.
     Out of the box it runs in ECHO mode: Web Speech STT + local Piper TTS +
     a fake "LLM" that repeats you. No keys, no backend, no cost. Open
     settings to point it at a real LLM. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>voiceloop</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0b0d10; --panel:#14171c; --line:#242932; --fg:#eceef1; --dim:#79818d;
    --c:#4a5361;                        /* current state colour — everything reads from here */
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.55 ui-sans-serif,system-ui,-apple-system,sans-serif }
  main { max-width:660px; margin:0 auto; padding:36px 18px 48px;
         display:flex; flex-direction:column; align-items:center; gap:16px }

  /* ── the orb ───────────────────────────────────────────────────────────────
     Plain CSS on purpose. A WebGPU version looks marginally better and is dark
     for every Linux visitor (Chrome blocklists the adapter there), and an SVG
     goo filter costs real CPU per frame for the same silhouette. Everything
     below runs on the compositor and degrades to a flat disc under
     prefers-reduced-motion.

     One knob drives the whole thing: --lvl (0..1, the live mic/voice level from
     the agent's `level` event). Size, glow, rim and halo all read from it, so
     the orb BREATHES with the audio instead of blinking between states. */
  #orb { position:relative; width:230px; height:230px; display:grid; place-items:center;
         --a:#22304a; --b:#3d5274; --cc:#1d2740; --d:#2c3b57; --spin:30s; --glow:.14; --lvl:0 }

  /* Halo: the light this thing throws on the page. It sits OUTSIDE the clipped orb, so the glow
     blooms past the rim — at video scale that bloom is most of the "alive" read.
     Two stops, not one: a tight inner bloom that hugs the rim (that's the part that reads as the
     object emitting light) and a wide, very faint spill. A single wide gradient just washes the
     whole frame in flat colour and looks like a backdrop instead of a glow. */
  #orb::before { content:''; position:absolute; inset:-34%; border-radius:50%; pointer-events:none;
                 background:radial-gradient(circle, var(--b) 0 30%,
                                            color-mix(in oklab, var(--b) 45%, transparent) 44%,
                                            transparent 68%);
                 opacity:calc(var(--glow) * (.3 + var(--lvl) * .7)); filter:blur(18px);
                 transform:scale(calc(.94 + var(--lvl) * .12));
                 transition:opacity .12s linear, transform .12s ease-out }

  /* The ball. A lit sphere, not a flat disc: the base gradient puts the light source up-left and
     falls to near-black at the lower-right, which is what gives it volume before a single blob
     is drawn. */
  #mic { position:relative; width:100%; height:100%; border-radius:50%; border:0; padding:0;
         cursor:pointer; overflow:hidden; display:grid; place-items:center;
         background:radial-gradient(125% 125% at 30% 22%, #202a3d 0%, #131a28 36%, #080b12 70%, #05070b 100%);
         /* level scales the body; the transition is short enough to track speech, long enough
            not to jitter on a single loud frame */
         transform:scale(calc(1 + var(--lvl) * .05));
         transition:transform .12s ease-out }
  /* Each blob is a soft disc smaller than the orb, wandering on its own ellipse.
     Blurred and screen-blended, five of them read as one body that swells and
     pinches where they overlap — metaballs, minus the shader. The blur tightens
     as the level rises, so loud audio makes the core condense and brighten.
     They are deliberately LARGE and travel a short path: small blobs on a wide orbit separate into
     visibly distinct lumps at the extremes, which reads as four stains rather than one substance. */
  #mic i { position:absolute; width:62%; height:62%; left:19%; top:19%; border-radius:50%;
           filter:blur(calc(26px - var(--lvl) * 7px)); mix-blend-mode:screen;
           animation:wander var(--spin) ease-in-out infinite;
           transition:background 1s, filter .12s linear }   /* colours cross-fade; the speed change snaps (animation-* isn't animatable) */
  /* Each blob gets its OWN size and resting offset. Sharing one geometry and varying only the
     animation timing makes them sweep the same path and stack into a single horizontal band
     through the middle; staggering the anchors keeps the mass off-axis and organic. */
  /* Anchors sit in DIFFERENT quadrants (up-left, up-right, low-left, low-right) so the combined
     mass stays centred. Clustering them on one side pools all the light there and leaves a heavy
     dead crescent on the other — the sphere stops looking filled. */
  /* Anchors are each offset from the blob's OWN centred position ((100-size)/2) into a different
     quadrant, so the resting pose is balanced. Offsetting from a shared number instead makes the
     bigger blobs sit further out than the small ones and the cluster drifts up-left. */
  #mic i:nth-child(1) { background:radial-gradient(circle, var(--a)  0 24%, transparent 62%);
                        top:9%; left:9% }                                   /* 62% → centred 19% */
  #mic i:nth-child(2) { background:radial-gradient(circle, var(--b)  0 22%, transparent 60%);
                        width:54%; height:54%; top:13%; left:33%;           /* 54% → centred 23% */
                        animation-name:wander2;
                        animation-duration:calc(var(--spin)*.72); animation-direction:reverse }
  #mic i:nth-child(3) { background:radial-gradient(circle, var(--cc) 0 26%, transparent 64%);
                        width:66%; height:66%; top:27%; left:7%;            /* 66% → centred 17% */
                        animation-name:wander3;
                        animation-duration:calc(var(--spin)*1.4); animation-delay:calc(var(--spin)*-.3) }
  #mic i:nth-child(4) { background:radial-gradient(circle, var(--d)  0 20%, transparent 58%);
                        width:50%; height:50%; top:35%; left:35%;           /* 50% → centred 25% */
                        animation-name:wander2;
                        animation-duration:calc(var(--spin)*.9); animation-direction:reverse;
                        animation-delay:calc(var(--spin)*-.55) }
  /* A 5th blob pinned near the centre and driven ONLY by level: the core that lights up when you
     speak. Without it the wandering blobs can all be off-centre at the moment you talk, and the
     orb answers your voice from its edge. */
  /* Only a HINT of white at the very centre: screen-blending five layers already drives the overlap
     toward white, so a white-cored fifth blob clips the whole middle to a flat highlight and the
     state colour disappears exactly when the orb is most active. */
  #mic i:nth-child(5) { width:64%; height:64%; left:18%; top:18%; animation:none;
                        background:radial-gradient(circle, color-mix(in oklab, var(--b) 88%, white) 0 14%,
                                                   var(--b) 34%, transparent 64%);
                        opacity:calc(var(--lvl) * .72); filter:blur(calc(20px - var(--lvl) * 8px));
                        transform:scale(calc(.72 + var(--lvl) * .38));
                        transition:opacity .12s linear, transform .12s ease-out, filter .12s linear }
  /* Glass shell: the specular cap up-left where the light is, plus a BOUNCE light low-right in the
     state colour. The bounce is what stops the bottom of the sphere reading as a dead black
     crescent — real objects catch light back off their surroundings, and without it the orb looks
     like a lit stain on a black hole. */
  #mic::before { content:''; position:absolute; inset:0; border-radius:50%; pointer-events:none;
                 background:radial-gradient(62% 46% at 33% 19%, rgba(255,255,255,.34) 0 8%,
                                            rgba(255,255,255,.07) 30%, transparent 58%),
                            radial-gradient(58% 44% at 70% 86%,
                                            color-mix(in oklab, var(--b) calc(16% + var(--lvl)*26%), transparent) 0 12%,
                                            transparent 62%);
                 box-shadow:inset 0 0 46px rgba(0,0,0,.7), inset 0 1px 1px rgba(255,255,255,.22) }
  /* Fresnel rim + outer glow. The hairline ring is the polish: a lit sphere has a bright edge where
     it turns away from you, and 1px of state colour there is what separates "orb" from "blurry
     blob". It brightens with level, so the edge rings on loud syllables. */
  #mic::after  { content:''; position:absolute; inset:0; border-radius:50%; pointer-events:none;
                 box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--b) calc(20% + var(--lvl) * 45%), transparent),
                            inset 0 0 calc(20px + var(--lvl) * 28px) color-mix(in oklab, var(--b) calc(8% + var(--lvl) * 22%), transparent),
                            0 0 44px 6px color-mix(in oklab, var(--b) 45%, transparent);
                 opacity:calc(.35 + var(--glow) * .65); transition:opacity .8s, box-shadow .12s linear }
  /* Three ORBITS, not one. Sharing a single path (even at different speeds and delays) marches every
     blob along the same diagonal, so the mass stays a bar that slides corner to corner instead of
     circulating. These run the loop in different rotational orders, which keeps the interior
     churning and the silhouette asymmetric. */
  @keyframes wander {
    0%,100% { transform:translate(-20%,-13%) scale(1)    }
    25%     { transform:translate( 18%,-20%) scale(1.16) }
    50%     { transform:translate( 21%, 17%) scale(.88)  }
    75%     { transform:translate(-17%, 20%) scale(1.1)  }
  }
  @keyframes wander2 {
    0%,100% { transform:translate( 19%,-16%) scale(1.08) }
    25%     { transform:translate(-21%,-10%) scale(.9)   }
    50%     { transform:translate(-14%, 21%) scale(1.18) }
    75%     { transform:translate( 20%, 12%) scale(.94)  }
  }
  @keyframes wander3 {
    0%,100% { transform:translate(  4%, 22%) scale(.92)  }
    25%     { transform:translate( 22%, -6%) scale(1.12) }
    50%     { transform:translate( -6%,-22%) scale(1)    }
    75%     { transform:translate(-22%,  6%) scale(1.14) }
  }
  /* Ripple: one ring per turn boundary, fired from JS (see `ripple()`). It marks the two instants
     the transcript can't show — the moment your turn was committed, and the moment a barge-in cut
     the reply — which is exactly what a viewer needs to SEE to believe the latency numbers. */
  #orb u { position:absolute; inset:0; border-radius:50%; border:1.5px solid var(--c);
           opacity:0; pointer-events:none; animation:ripple .75s ease-out forwards }
  @keyframes ripple {
    from { opacity:.55; transform:scale(1) }
    to   { opacity:0;   transform:scale(1.5) }
  }
  /* the glyph leads while the orb is dark; once the loop is live the orb says it better */
  #glyph { position:relative; font-size:36px; line-height:1; transition:opacity .4s;
           text-shadow:0 2px 12px #000 }
  body:not([data-state="idle"]) #glyph { opacity:0 }

  /* Same object, more energy — the whole state display is these three lines. Each palette is one
     hue family with a neighbour (green→teal, amber→gold, coral→magenta) rather than opposite
     corners of the wheel: four unrelated hues screen-blended average out to a muddy grey-brown
     exactly where the blobs overlap, which is the middle of the orb. */
  body[data-state="listening"] #orb { --a:#0fa5c9; --b:#2ee6a8; --cc:#0d7fa8; --d:#7df0c8; --spin:14s;  --glow:.5 }
  body[data-state="thinking"]  #orb { --a:#d98324; --b:#ffb547; --cc:#b0621a; --d:#ffd98a; --spin:6s;   --glow:.7 }
  body[data-state="speaking"]  #orb { --a:#e8355f; --b:#ff7038; --cc:#b8329a; --d:#ff9a5e; --spin:4s;   --glow:.95 }

  body[data-state="listening"] { --c:#39d98a }
  body[data-state="thinking"]  { --c:#ffc453 }
  body[data-state="speaking"]  { --c:#ff8a3d }

  /* Reduced motion: hold the orb STILL. Killing the transitions alone isn't enough — the level var
     keeps changing, so every scale would just snap instead of glide. Pin --lvl and the object
     becomes a flat, quietly coloured disc that still reads state by hue. (setLevel() also stops
     writing the var, and ripple() creates no rings — a display:none ring never fires animationend,
     so it would leak one element per turn.) */
  @media (prefers-reduced-motion: reduce) {
    #orb { --lvl:0 !important }
    #mic i { animation:none } #mic, #orb::before, #mic i { transition:none }
    #orb u { display:none }
  }

  #status { color:var(--c); font-size:14px; min-height:22px; text-align:center; transition:color .3s }
  #lat { font:12px/1 ui-monospace,monospace; color:var(--dim); min-height:14px }

  /* ── transcript ─────────────────────────────────────────────────────── */
  #chat { width:100%; display:flex; flex-direction:column; gap:10px }
  #chat:not(:empty) { margin-top:6px }
  .msg { padding:10px 14px; border-radius:14px; max-width:82%; white-space:pre-wrap; word-break:break-word }
  .msg.user { align-self:flex-end;   background:#212c3a; border-bottom-right-radius:4px }
  .msg.ai   { align-self:flex-start; background:#1a1e25; border-bottom-left-radius:4px }
  /* Barge-in: the reply stopped mid-word because you cut in. Without a mark, an interrupted bubble
     is indistinguishable from a short answer — and interruption is the feature. */
  .msg.ai.cut .tail { text-decoration:line-through; text-decoration-color:#ff8a3d80 }
  .msg.ai.cut::after { content:'interrupted'; display:block; margin-top:5px;
                       font-size:10px; letter-spacing:.04em; color:#ff8a3d; opacity:.85 }
  /* An echoed reply is not an answer — mark it so the transcript can't be read as a model talking. */
  .msg.ai.echoed { border-left:2px solid #e0a94a }
  .msg.ai.echoed::after { content:'echo — no model'; display:block; margin-top:5px;
                          font-size:10px; letter-spacing:.04em; color:#e0a94a; opacity:.85 }
  .msg.interim { opacity:.5 }
  .msg .tail { opacity:.35 }                 /* generated, not yet spoken */
  .msg.tool { align-self:flex-start; background:#161d17; color:#8fc79a;
              font:12px/1.4 ui-monospace,monospace }
  .msg.note { align-self:center; background:none; color:var(--dim); font-size:12px; padding:0 }
  .msg.err  { align-self:center; background:#38141d; color:#ffb0bd; font-size:13px }

  /* ── everything else, out of the way ────────────────────────────────── */
  .bar { width:100%; display:flex; gap:8px }
  input, select, button.btn { background:#0f1216; color:var(--fg); border:1px solid var(--line);
                              border-radius:9px; padding:9px 12px; font:inherit }
  input:focus, select:focus { outline:none; border-color:var(--c) }
  button.btn { cursor:pointer } button.btn:hover { border-color:#3a424e }
  /* iOS Safari auto-zooms the page when you focus a field whose text is under 16px, and it does NOT
     zoom back out on blur — one tap on "type a turn" and the whole demo is left scaled up and
     panned. 16px is the documented threshold, so meet it on touch devices (the 11px settings
     labels stay small; only the FIELDS matter). */
  @media (pointer: coarse) { input, select, textarea { font-size:16px } }
  #typed { flex:1 }
  details { width:100%; border-top:1px solid var(--line); padding-top:10px }
  summary { cursor:pointer; color:var(--dim); font-size:13px; list-style:none }
  /* A 13px line of text is a ~20px tap target; both platforms' guidelines say ~44px. Padding is
     enough — these are the only touch controls on the page that aren't already finger-sized.
     min-height pins the result at 44px instead of trusting 13px text to round up to it. */
  @media (pointer: coarse) { summary { padding:11px 0; min-height:44px; box-sizing:border-box } }
  summary::before { content:'▸ ' } details[open] summary::before { content:'▾ ' }
  /* One row per pipeline stage, in the order the audio flows (LLM group first only because `mode`
     is the master switch). A flat 11-field soup made "which url goes with which provider" a puzzle;
     the heading answers it before the placeholder has to. */
  .grid { display:flex; flex-direction:column; gap:14px; padding:12px 0 4px }
  .set { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end }
  .set h4 { flex-basis:100%; margin:0 0 -4px; font-size:10px; font-weight:600;
            letter-spacing:.1em; text-transform:uppercase; color:var(--dim); opacity:.65 }
  label { font-size:11px; color:var(--dim); display:flex; flex-direction:column; gap:4px }
  /* A field the current choices ignore must LOOK ignored, not merely refuse focus. */
  input:disabled, select:disabled { opacity:.4 }
  #log { font:11px/1.5 ui-monospace,monospace; color:var(--dim);
         max-height:220px; overflow:auto; white-space:pre-wrap; padding-top:8px }
  /* Which code is actually running — the demo must never let you mistake the browser's own
     recognizer for voiceloop's pipeline, or an echo stand-in for a real LLM. Sits right above the
     collapsed settings (it describes what they configure), not in the hero area under the orb.
     Arrow chains are .nb (no-break): "Silero VAD →<br>feed" reads as a broken message. */
  #pipeline { width:100%; font-size:11.5px; color:var(--dim); line-height:1.7;
              border-top:1px solid var(--line); padding-top:10px }
  #pipeline:empty { display:none }
  #pipeline b { color:#c8d0da; font-weight:600 }
  #pipeline .warn { color:#e0a94a }
  #pipeline .nb { white-space:nowrap }
</style>
</head>
<body>
<main>
  <div id="orb">
    <button id="mic" title="click to start / stop · click while it talks to interrupt">
      <i></i><i></i><i></i><i></i><i></i><span id="glyph">🎙</span>
    </button>
  </div>
  <div id="status">click to start · then just talk</div>
  <div id="lat"></div>

  <div id="chat"></div>

  <div class="bar">
    <input id="typed" placeholder="…or type a turn">
    <button class="btn" id="send">Send</button>
  </div>

  <div id="pipeline"></div>

  <details>
    <summary>settings</summary>
    <div class="grid">
      <div class="set">
        <h4>llm</h4>
        <label>mode<select id="mode">
          <option value="echo">echo — no keys, no backend</option>
          <option value="hosted">full loop — hosted claude haiku</option>
          <option value="llm">full loop — your LLM</option>
        </select></label>
        <label>LLM url<input id="llmUrl" size="30" value="http://localhost:11434/v1/chat/completions"></label>
        <label>model<input id="model" size="14" value="llama3.2"></label>
      </div>
      <div class="set">
        <h4>speech to text</h4>
        <label>provider<select id="sttProvider"></select></label>
        <label>language<select id="sttLang"></select></label>
        <label>token url<input id="sttTokenUrl" size="30" placeholder="your backend route (see examples/token-worker)"></label>
      </div>
      <div class="set">
        <h4>text to speech</h4>
        <label>provider<select id="ttsProvider">
          <option value="piper">piper — free, in-browser</option>
          <option value="elevenlabs">elevenlabs — needs TTS url</option>
        </select></label>
        <label>voice<select id="voice"></select></label>
        <label>TTS url<input id="ttsUrl" size="30" placeholder="your backend route (see examples/token-worker)"></label>
      </div>
      <div class="set">
        <h4>input &amp; auth</h4>
        <label>mic<select id="micDeviceId"><option value="">default</option></select></label>
        <label>api key<input id="apiKey" size="26" placeholder="Bearer for your LLM · X-API-Key for token url"></label>
      </div>
    </div>
    <div class="bar">
      <button class="btn" id="clear">Clear</button>
      <button class="btn" id="muteMic">Mute mic</button>
      <button class="btn" id="muteTts">Mute voice</button>
    </div>
  </details>

  <details><summary>log</summary><div id="log"></div></details>
</main>

<script type="module">
import { VoiceAgent, PiperTTS, ElevenLabsTTS, makeOpenAILLM, unlockAudio, prewarmVoice, STT_PROVIDERS, sttSelfCaptures, LANG_NAMES } from './src/index.js';

// Load VAD/WASM + build the Silero session while the page sits idle — but ONLY for a provider that
// will actually use it. A selfCapture provider (webspeech) builds no pipeline, so prewarming there
// downloads an ONNX model to feed a detector that never runs.
const prewarmIfPipelined = () => { if (!sttSelfCaptures($('sttProvider').value)) prewarmVoice(); };

const $ = id => document.getElementById(id);
const fill = (id, entries) => $(id).append(...entries.map(([value, textContent]) =>
  Object.assign(document.createElement('option'), { value, textContent })));

// Every choice below is READ from the library, never retyped here: a provider added to STT_PROVIDERS
// or a language added to LANG_NAMES shows up in this page by itself. A hand-typed copy would be a
// second source of truth that silently rots — and a demo that lies about what the library supports.
fill('sttProvider', Object.keys(STT_PROVIDERS).map(p => [p, p === 'webspeech' ? 'webspeech — free, in-browser' : p]));
fill('sttLang', Object.entries(LANG_NAMES).map(([code, name]) => [code, `${code} — ${name}`]));
const SETTINGS = ['mode','llmUrl','model','sttProvider','sttTokenUrl','apiKey','sttLang','ttsProvider','ttsUrl','micDeviceId'];
for (const id of SETTINGS) {
  const v = localStorage.getItem('vl.' + id); if (v) $(id).value = v;
  $(id).addEventListener('change', () => {
    localStorage.setItem('vl.' + id, $(id).value);
    onSettingChanged();   // the banner must never describe the PREVIOUS choice
  });
}
const log = (...a) => {
  const line = `${new Date().toISOString().slice(11,23)} ${a.map(x => typeof x === 'string' ? x : JSON.stringify(x)).join(' ')}`;
  $('log').textContent = (line + '\n' + $('log').textContent).slice(0, 20000);
};

// ── transcript ──────────────────────────────────────────────────────────────
const chat = $('chat');
let interimEl = null, vadOff = null, spokenLen = 0;
// The transcript's single source of truth for replies: turn id → its bubble. EVERY assistant event
// routes through it — there is no separate "current bubble" to fall out of sync with. A turn's
// entry lives from its first painted event to its settle (final / drop / reply-scoped error), so a
// straggler from an interrupted turn finds its own bubble by id, wherever it sits in the chat.
// Ids are per-agent and monotonic, so `liveTurn` (the highest id seen) tells present from past:
// smaller = a straggler correcting history — it paints its bubble but drives no cosmetics.
const turnEls = new Map();
let liveTurn = 0;                  // turns count from 1; reset with the agent that issued them

// The dimmed tail is "written but not yet heard": on a final, a non-empty tail means the reply was
// cut off mid-sentence. Shared by the live path and the late-straggler path so an interrupted reply
// renders identically no matter when its last event lands.
const paintTail = (el, e) => {
  const tail = (e.full ?? e.text).slice(e.text.length);
  if (tail) el.append(Object.assign(document.createElement('span'), { className:'tail', textContent:tail }));
  el.classList.toggle('cut', !!(e.final && tail.trim()));   // toggle: a late repaint must also CLEAR a stale cut mark
  return tail;
};
const toolEls = new Map();
const bubble = (cls, text = '') => {
  const el = document.createElement('div');
  el.className = `msg ${cls}`; el.textContent = text;
  chat.append(el); el.scrollIntoView({ block:'nearest' });
  return el;
};

// ── latency: the two numbers that decide whether this feels alive ───────────
let t0 = 0, tText = 0, tAudio = 0;
const showLat = () => $('lat').textContent = [
  tText  && `first token ${tText - t0}ms`,
  tAudio && `first sound ${tAudio - t0}ms`,
].filter(Boolean).join('   ·   ');

// `tts` is a LET built ONLY by applyTts() — including the first one, from the RESTORED settings.
// It used to be initialised here with a hardcoded PiperTTS, which ignored a saved elevenlabs
// choice: the page came back on Piper every reload while the form still read "elevenlabs".
let tts;            // assigned by applyTts(), below buildTts()'s definition
let agent = null;

// ElevenLabs needs a backend route (the key must not reach the page — see examples/token-worker).
// Without one this returns NULL rather than quietly substituting Piper: falling back would speak in
// a different voice than the form promises, and "elevenlabs selected, Piper's voice coming out" is
// indistinguishable from a broken integration. No synthesizer → the page says so and won't start.
const buildTts = () => {
  const url = $('ttsUrl').value.trim();
  if ($('ttsProvider').value === 'elevenlabs') {
    if (!url) return null;
    const voice = localStorage.getItem('vl.elVoice') || undefined;   // Piper ids are not EL ids — keep them apart
    return new ElevenLabsTTS({ ttsUrl: url, ...(voice ? { voiceId: voice } : {}) });
  }
  return new PiperTTS(localStorage.getItem('vl.voice') || undefined);
};
// The demo's own backend (examples/token-worker). Same origin-allowlisted Worker as /stt/token and
// /tts, so 'hosted' costs the visitor no key at all — the point of a demo you can just click.
const HOSTED_LLM_URL = 'https://voiceloop-token.havlikmarcell.workers.dev/llm';
const TTS_MISSING = 'elevenlabs needs a TTS url — paste your backend route (see examples/token-worker) or switch TTS back to piper';

// Echo mode: a stand-in "LLM" that repeats the turn VERBATIM — exercises the entire
// VAD→STT→…→TTS loop, barge-in included, with no key and no backend. Nothing is added to the
// text: a reply that is exactly the transcript is the whole point, since any prefix would be
// this page's words in the reply and would blur what the recognizer actually heard. That it's
// an echo and not a model is stated in the pipeline banner and on the bubble itself.
async function* echoLLM(history) {
  const last = [...history].reverse().find(m => m.role === 'user')?.content ?? '';
  for (const w of last.match(/\S+\s*/g) ?? []) {
    yield { text: w }; await new Promise(r => setTimeout(r, 25));
  }
}

// ── what is ACTUALLY running ────────────────────────────────────────────────
// A demo that hides which engine served a reply is worse than no demo: a browser-native
// recognizer looks identical to voiceloop's pipeline, and an echo stand-in looks identical
// iPadOS 13+ reports itself as "MacIntel", so the touch-point check is what separates an iPad
// from a desktop Mac — UA sniffing alone would let the iPad through unwarned.
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
// Safari ships webkitSpeechRecognition but it goes deaf after an utterance without firing onend/onerror,
// and iOS ducks the speakers while it holds the mic. Say so here rather than let the demo look broken.
const IOS_WEBSPEECH_WARNING = '<span class="warn"><br>⚠️ on iOS this often stops hearing you after the ' +
  'first reply, and quiets the speaker — pick a cloud STT provider in settings for a reliable loop</span>';

// to a model. Both get named on screen, always.
const describePipeline = (a) => {
  const echo = $('mode').value === 'echo';
  // Before the first click there is no session, so ask the provider statically — reading
  // `a?.stt?.selfCapture` off a null agent silently yields false and the banner claims the
  // pipeline is running when it is exactly what gets bypassed.
  const self = a?.stt ? !!a.stt.selfCapture : sttSelfCaptures($('sttProvider').value);
  const stt = self
    ? `<b>${$('sttProvider').value}</b> — the browser's own recognizer owns the mic <span class="warn">(voiceloop's VAD + STT pipeline bypassed)</span>${IS_IOS ? IOS_WEBSPEECH_WARNING : ''}`
    : `<b>${$('sttProvider').value}</b> via voiceloop's pipeline — <span class="nb">Silero VAD → feed → commit</span>`;
  // new URL() throws on a half-typed url — a banner must never take the page down with it.
  const host = (u) => { try { return new URL(u).host; } catch { return u || 'unset'; } };
  const llm = echo
    ? '<span class="warn"><b>echo</b> — no model: replies repeat your words back</span>'
    : hosted()
      ? `<b>claude haiku</b> — hosted by this demo, no key needed`
      : `<b>${$('model').value || 'your model'}</b> at ${host($('llmUrl').value)}`;
  return `STT: ${stt}<br>LLM: ${llm}`;
};
const showPipeline = () => { $('pipeline').innerHTML = describePipeline(agent); };
// Hoisted (function declaration) so the settings listeners above can call it before this point.
function onSettingChanged() {
  // Say it with the UI, not just the banner: fields the current choices IGNORE are disabled, so the
  // form can't imply that a typed url or key is doing something. (ttsUrl is applyTts()'s to
  // disable — it lives on the provider-change path, not here.)
  const custom = $('mode').value === 'llm';
  const self = sttSelfCaptures($('sttProvider').value);   // webspeech: no token route, no pipeline
  for (const id of ['llmUrl', 'model']) $(id).disabled = !custom;
  $('sttTokenUrl').disabled = self;
  $('apiKey').disabled = !custom && self;   // used as LLM Bearer OR token-route X-API-Key — dead only when neither hop exists
  showPipeline(); prewarmIfPipelined();
}

// ── the orb's level ─────────────────────────────────────────────────────────
// One CSS var, --lvl (0..1), drives size/glow/rim/halo. Three sources feed it, in order of truth:
//   1. the agent's `level` event — real mic RMS, the only honest one (pipeline STT only);
//   2. while SPEAKING — the reply's spoken-char rate, so the orb pulses with its own voice
//      (voiceloop plays TTS through an internal AEC sink we can't tap, and re-tapping the mic
//      would just measure the echo it works to suppress);
//   3. a selfCapture STT (webspeech) emits no level at all — fall back to the VAD-style pulse.
// Every source decays: a level that only ever rises reads as a stuck meter.
// Sources are SPARSE (a level event every ~256ms capture chunk), so both the target's decay and the
// displayed value are functions of ELAPSED TIME, not of frame count: a per-frame multiplier would
// empty the meter between two events at 60fps and flicker, and would run at a different speed on a
// 144Hz display.
const orb = $('orb');
const stillMotion = matchMedia('(prefers-reduced-motion: reduce)');
const HALF_LIFE_MS = 260;                                        // target sags to half this long after its last source sample
const ATTACK_MS = 60, RELEASE_MS = 320;                          // fast attack, slow release — how a meter reads as "alive"
const decayed = (v, ms, halfLife) => v * Math.pow(0.5, ms / halfLife);
let lvl = 0, lvlTarget = 0, lastFrame = 0, running = false;
const setLevel = (v) => {
  if (!Number.isFinite(v) || stillMotion.matches) return;   // a NaN would poison the meter for the page's lifetime
  lvlTarget = Math.max(lvlTarget, Math.min(1, Math.max(0, v)));
  if (!running) { running = true; lastFrame = 0; requestAnimationFrame(tickLevel); }
};
// Runs only while there is something to show: sources re-arm it, and it parks itself once the meter
// has settled at rest — an idle demo shouldn't be writing a style property 60 times a second.
function tickLevel(now) {
  const dt = Math.min(100, now - (lastFrame || now)); lastFrame = now;   // clamp: a backgrounded tab resumes with a huge gap
  lvlTarget = decayed(lvlTarget, dt, HALF_LIFE_MS);
  // Exponential approach toward the target, converging at the same rate regardless of frame rate.
  lvl += (lvlTarget - lvl) * (1 - Math.exp(-dt / (lvlTarget > lvl ? ATTACK_MS : RELEASE_MS)));
  if (lvl < 0.002 && lvlTarget < 0.002) { lvl = lvlTarget = 0; running = false; }
  orb.style.setProperty('--lvl', lvl.toFixed(3));
  if (running) requestAnimationFrame(tickLevel);
}

// One ring per turn boundary. Marks the two instants the transcript cannot show: your turn being
// committed, and a barge-in cutting the reply. Under reduced motion the ring is display:none, which
// never fires animationend — so don't create one at all rather than leak an element per turn.
const ripple = () => {
  if (stillMotion.matches) return;
  const u = document.createElement('u');
  u.onanimationend = () => u.remove();
  orb.append(u);
};

// A typed turn drives the same state machine without a mic — don't claim we're listening then.
let micOn = false;
const STATUS = {
  idle:      () => micOn ? 'listening — just talk' : 'click to start · then just talk',
  listening: () => micOn ? 'listening — just talk' : 'ready · click to talk',
  thinking:  () => 'thinking…',
  speaking:  () => micOn ? 'speaking — talk over it to interrupt' : 'speaking — click to interrupt',
};
// The first spoken reply blocks on a ~60MB Piper voice download (once — it's cached in OPFS after).
// On mobile data that is a minute during which the status line claimed "speaking", which reads as
// "the demo is broken". While the model is coming down, the download owns the status line.
let modelPct = null;
const setState = s => {
  document.body.dataset.state = micOn || s !== 'listening' ? s : 'idle';
  if (modelPct === null) $('status').textContent = STATUS[s]?.() ?? s;
};
// Re-attached on every rebuild: the hook lives on the TTS instance, so a new synthesizer would
// otherwise download its 60MB model in silence again.
const wireModelProgress = () => tts?.setOnModelProgress?.((loaded, total) => {
  const done = total && loaded >= total;
  modelPct = done ? null : total ? Math.floor((loaded / total) * 100) : 0;
  $('status').textContent = done ? (STATUS[document.body.dataset.state]?.() ?? '')
    : `downloading the voice — ${modelPct}%  (${(loaded / 1048576).toFixed(0)}MB${total ? ` of ${(total / 1048576).toFixed(0)}MB` : ''}, once)`;
});   // applyTts() attaches this — including for the FIRST synthesizer, which it also builds

function onEvent(e) {
  if (e.type !== 'stt' || e.turnComplete) log(e);
  switch (e.type) {
    case 'state':
      // The agent can stop itself (mic denied, STT socket died) — the mic light
      // follows the agent, never the other way round.
      if (e.state === 'idle' && agent?.closed) { micOn = false; document.body.dataset.vad = '0'; }
      setState(e.state);
      break;
    case 'vad': document.body.dataset.vad = e.active ? '1' : '0'; break;
    case 'level': setLevel(e.level); break;
    case 'stt':
      // A selfCapture provider runs no agent VAD, so no 'vad'/'level' event ever arrives and the orb
      // would sit dead still while the browser hears you perfectly — looking exactly like a broken
      // mic. Live partials are the only "I hear you" signal on that path, so pulse from them.
      if (agent?.stt?.selfCapture) {
        document.body.dataset.vad = e.turnComplete ? '0' : '1';
        if (!e.turnComplete) setLevel(0.55);
        clearTimeout(vadOff);
        if (!e.turnComplete) vadOff = setTimeout(() => { document.body.dataset.vad = '0'; }, 700);
      }
      if (e.turnComplete) {
        ripple();                        // your turn closed — the instant the latency clock starts
        interimEl?.remove(); interimEl = null;
        bubble('user', e.text);
        t0 = Date.now(); tText = tAudio = 0; $('lat').textContent = '';
      } else {
        interimEl ??= bubble('user interim');
        interimEl.textContent = `${e.committed ?? ''} ${e.text}`.trim();
        interimEl.scrollIntoView({ block:'nearest' });
      }
      break;
    case 'assistant': {
      // ONE routing rule: this event paints the bubble of ITS turn — looked up in turnEls, created
      // on the turn's first painted event. A barge-in ends turn N while its final is still in
      // flight, so it can land after turn N+1 exists; keyed by id, it still finds its own bubble.
      // `live` (id >= the highest seen) does NOT change where text goes — it only gates cosmetics:
      // a straggler correcting history must not pulse the orb, stamp latency, ripple, or scroll.
      const live = e.turn >= liveTurn;
      if (live && e.turn > liveTurn) { liveTurn = e.turn; spokenLen = 0; }   // a NEW reply starts its cursor at 0 (notify() has no stt event to reset it)
      let el = turnEls.get(e.turn);
      // "That draft never happened" (interrupted before a word was spoken) → drop the bubble
      // rather than blank it. Told apart from the FIRST progress tick — also empty (cursor at 0)
      // but carrying `full` — which must NOT tear the live bubble down.
      if (!e.text && !e.final && e.full == null) { el?.remove(); turnEls.delete(e.turn); break; }
      if (!el) {
        if (!live) break;   // a settled turn with no bubble has no correct place to paint — ignore
        // Tag the bubble (never the text) when no model produced it — the reply is a verbatim
        // echo, and only the UI should say so.
        el = bubble($('mode').value === 'echo' ? 'ai echoed' : 'ai');
        turnEls.set(e.turn, el);
      }
      el.textContent = e.text;                                      // spoken so far
      const tail = paintTail(el, e);
      if (e.final) turnEls.delete(e.turn);                          // settled: stop tracking (the bubble stays)
      if (!live) break;                                             // history corrected; the present is untouched
      if (!tText && t0) { tText = Date.now(); showLat(); }
      // `full` only exists once the TTS progress cursor is live — i.e. a clip is actually playing.
      // The 'speaking' state is just the first token, not sound.
      if (e.full != null && t0 && !tAudio) { tAudio = Date.now(); showLat(); }
      // The agent's own voice has no level event (TTS plays through an internal AEC sink), so drive
      // the orb from how fast the spoken CURSOR advances — the orb rides its own speech. Only events
      // carrying `full` have a cursor; a pre-audio streaming draft would otherwise run spokenLen up
      // to the draft's length and the NEXT reply would sit flat until it grew past that stale mark.
      if (e.full != null) {
        setLevel(0.35 + Math.min(0.6, Math.max(0, e.text.length - spokenLen) * 0.09));
        spokenLen = e.text.length;
      }
      if (e.final && tail.trim()) ripple();
      el.scrollIntoView({ block:'nearest' });
      break;
    }
    case 'tool': {
      // running and result arrive as two events with one id: update, don't stack. The id stays
      // mapped after the outcome — a tool finalized as "interrupted" whose detached run settles
      // later corrects that SAME chip in place (re-emits are deduped library-side, and a dead
      // agent's late event can't get here at all: makeAgent's onEvent is identity-guarded).
      const el = toolEls.get(e.id) ?? bubble('tool');
      if (e.id) toolEls.set(e.id, el);
      el.textContent = `🔧 ${e.name}(${JSON.stringify(e.args)})${e.running ? ' …' : ` → ${JSON.stringify(e.result ?? '')}`.slice(0,200)}`;
      break;
    }
    case 'echo':  bubble('note', `self-echo dropped: ${e.text}`); break;
    case 'error':
      bubble('err', e.error);
      // A reply-scoped error (it carries the turn) ends that reply without a final assistant event —
      // release its bubble from tracking (the partial text stays visible) so the map can't grow.
      if (e.turn != null) turnEls.delete(e.turn);
      break;
  }
}

const muted = id => $(id).dataset.on === '1';
const hosted = () => $('mode').value === 'hosted';
const makeAgent = () => {
  // Hosted mode gets its OWN llm client rather than blanking the shared `apiKey`: that one field
  // also authenticates the STT token route (X-API-Key), so clearing it would silently break a
  // custom STT backend. This drops the Authorization header on the LLM hop ONLY — the hosted route
  // holds its own key and pins its own model, so neither belongs in the request.
  const a = new VoiceAgent({
    llmUrl: $('llmUrl').value.trim(),
    model: $('model').value.trim(),
    apiKey: $('apiKey').value.trim(),
    sttProvider: $('sttProvider').value,
    sttTokenUrl: $('sttTokenUrl').value.trim(),
    sttLang: $('sttLang').value,
    micDeviceId: $('micDeviceId').value,
    persona: 'You are a concise, friendly voice assistant. Keep answers to a sentence or two.',
    tts,
    llm: $('mode').value === 'echo' ? echoLLM
       : hosted() ? makeOpenAILLM({ llmUrl: HOSTED_LLM_URL })   // no apiKey, no model: the route owns both
       : undefined,                                             // 'llm' → built from llmUrl/model/apiKey above
    // Identity-guarded: destroy() stops the loop but a DETACHED tool result still reports through
    // this agent's onEvent after it. Turn/tool ids are per-agent, so such a late event could match
    // the NEXT agent's same-numbered entry and repaint its bubble — dropping everything from a
    // non-current agent closes that whole class, instead of chasing each map it could touch.
    onEvent: (e) => { if (agent === a) onEvent(e); },
  });
  a.setMuted(muted('muteMic')); a.setTtsMuted(muted('muteTts'));   // the toggles survive a rebuild
  log('agent created; stt =', a.sttProvider); showPipeline();   // now reflects the LIVE session, not just the form
  return a;
};

// The ONLY way the page discards an agent. Turn ids are per-agent (each starts counting at 1), so
// tracking state keyed by them must die with the agent that issued them: a surviving turnEls entry
// would match the NEXT agent's same-numbered reply and hand it the dead agent's bubble to
// overwrite. (destroy() is terminal — the old agent can emit nothing further, so nothing is lost.)
const dropAgent = (why) => {
  if (!agent) return;
  agent.destroy(); agent = null;         // null FIRST-equivalent: the identity guard now drops every late event from it
  liveTurn = 0; spokenLen = 0; turnEls.clear();   // the next agent counts turns from 1 again
  toolEls.clear();                       // tool ids are provider-issued and can repeat — same hazard
  interimEl?.remove(); interimEl = null; // a half-heard interim went nowhere; the dead agent will never settle it
  clearTimeout(vadOff); document.body.dataset.vad = '0';
  t0 = tText = tAudio = 0; $('lat').textContent = '';   // latency legend described the dead session
  log(why, '→ agent rebuilt on next turn');
};

// ── one button does everything ──────────────────────────────────────────────
const stop = () => {
  dropAgent('stop'); micOn = false;
  document.body.dataset.vad = '0'; setState('idle');
onSettingChanged();   // describe the restored settings, and prewarm only if they'll use the VAD
};
$('mic').onclick = async () => {
  unlockAudio();                                   // must be inside the gesture (autoplay policy)
  // A reply in flight? then the click means "shut up", whether the mic is open
  // or not — it cancels the turn and keeps the session.
  if (agent && (agent.state === 'thinking' || agent.state === 'speaking')) return agent.interrupt();
  if (micOn) return stop();
  if (!tts) return bubble('err', TTS_MISSING);   // no voice → refuse to start, rather than open the mic on a loop that can't reply
  agent ??= makeAgent();
  micOn = true; setState('listening');
  try { await agent.start(); }
  catch (e) { bubble('err', String(e?.message ?? e)); stop(); }
};

$('send').onclick = () => {
  const text = $('typed').value.trim(); if (!text) return;
  if (!tts) return bubble('err', TTS_MISSING);
  unlockAudio();
  agent ??= makeAgent();
  agent.sendUserText(text);       // emits its own user bubble via the stt turnComplete event
  $('typed').value = '';
};
$('typed').onkeydown = e => { if (e.key === 'Enter') $('send').click(); };

$('clear').onclick = () => { chat.textContent = ''; $('log').textContent = ''; $('lat').textContent = '';
                             interimEl = null; turnEls.clear(); toolEls.clear(); };
const toggle = (id, fn) => $(id).onclick = () => {
  const on = $(id).dataset.on !== '1';
  $(id).dataset.on = on ? '1' : '0';
  $(id).style.borderColor = on ? 'var(--c)' : '';
  fn(on);
};
toggle('muteMic', on => agent?.setMuted(on));
toggle('muteTts', on => agent?.setTtsMuted(on));

// Voice switches live. The rest are constructor options, so they can only apply
// to a NEW agent — drop the current one so the next turn builds it from these.
$('voice').addEventListener('change', () => {
  // Piper ids and ElevenLabs voice ids share one picker but not one namespace — store them apart so
  // switching provider and back doesn't hand Piper an EL id (which resolves to no voice at all).
  if (!tts) return;
  localStorage.setItem(tts instanceof ElevenLabsTTS ? 'vl.elVoice' : 'vl.voice', $('voice').value);
  tts.setVoice($('voice').value); log('voice →', $('voice').value);
});
for (const id of SETTINGS.filter(i => !['ttsProvider','ttsUrl'].includes(i)))
  $(id).addEventListener('change', () => {
    if (micOn) return bubble('note', `stop the mic to apply ${id}`);
    dropAgent(id);
  });

// The synthesizer is a CONSTRUCTOR choice, so switching provider replaces the object — and the
// agent holds a reference to it, so it has to be rebuilt too (same rule as the settings above).
const applyTts = () => {
  $('ttsUrl').disabled = $('ttsProvider').value !== 'elevenlabs';
  tts = buildTts();
  if (!tts) bubble('note', TTS_MISSING);
  wireModelProgress();
  dropAgent('tts');
  loadVoices();
  log('tts →', $('ttsProvider').value);
};
let ttsUrlTimer;
for (const id of ['ttsProvider', 'ttsUrl'])
  for (const ev of ['change', 'input'])
    $(id).addEventListener(ev, () => {
      if (micOn) return bubble('note', `stop the mic to apply ${id}`);
      localStorage.setItem('vl.' + id, $(id).value);
      clearTimeout(ttsUrlTimer);
      ttsUrlTimer = setTimeout(applyTts, ev === 'input' ? 400 : 0);   // don't rebuild on every keystroke
    });

// ── device + voice lists ────────────────────────────────────────────────────
// Re-run on every rebuild: the voice list belongs to the synthesizer, and a stale Piper list would
// offer ids ElevenLabs can't speak.
function loadVoices() {
  $('voice').replaceChildren();
  if (!tts) return fill('voice', [['', TTS_MISSING]]);   // nothing to ask — say why, where the user is looking
  // Ask the synthesizer that is ACTUALLY live, never the form: buildTts() is the one place that
  // decides. Re-reading the form here would be a second copy of that rule, free to disagree with
  // it — and a picker offering ids the live voice can't speak is exactly the bug this avoids.
  const key = tts instanceof ElevenLabsTTS ? 'vl.elVoice' : 'vl.voice';
  tts.voices().then(vs => {
    if (!vs.length) return fill('voice', [['', "couldn't reach the TTS url — check the route + its origin allowlist"]]);
    fill('voice', vs.map(v => [v.id, v.name || v.id]));
    $('voice').value = localStorage.getItem(key) || tts.voiceId;   // the library's own default, not a copy of it
    if ($('voice').value) tts.setVoice($('voice').value);
  }).catch(e => log('voice list failed', String(e)));
}
applyTts();
navigator.mediaDevices?.enumerateDevices().then(ds => {
  for (const d of ds.filter(d => d.kind === 'audioinput'))
    $('micDeviceId').append(Object.assign(document.createElement('option'),
      { value: d.deviceId, textContent: d.label || d.deviceId.slice(0,8) }));
}).catch(() => {});

setState('idle');
onSettingChanged();   // the banner must describe the restored settings from the FIRST frame, not only after a click
window.agent = () => agent;   // console poking: agent().history, …
window.tts = () => tts;       // …and the live synthesizer: tts().voiceId, tts().constructor.name
</script>
</body>
</html>
